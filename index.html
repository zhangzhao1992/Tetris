<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101820">
    <meta name="description" content="经典俄罗斯方块网页版，支持电脑、平板和手机。">
    <title>经典俄罗斯方块</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app" aria-label="经典俄罗斯方块">
      <section class="game-shell">
        <header class="topbar">
          <div>
            <p class="eyebrow">Classic Tetris</p>
            <h1>俄罗斯方块</h1>
          </div>
          <button class="icon-button sound-toggle" type="button" aria-label="切换音效" title="音效">
            <span aria-hidden="true">♪</span>
          </button>
        </header>

        <div class="play-area">
          <div class="board-wrap" aria-label="游戏区域">
            <canvas id="board" width="300" height="600"></canvas>
            <div class="overlay" id="overlay">
              <p id="overlayTitle">准备开始</p>
              <button id="startButton" type="button">开始游戏</button>
            </div>
          </div>

          <aside class="side-panel" aria-label="游戏信息">
            <div class="stats-grid">
              <div class="stat">
                <span>分数</span>
                <strong id="score">0</strong>
              </div>
              <div class="stat">
                <span>等级</span>
                <strong id="level">1</strong>
              </div>
              <div class="stat">
                <span>消行</span>
                <strong id="lines">0</strong>
              </div>
              <div class="stat">
                <span>最高分</span>
                <strong id="best">0</strong>
              </div>
            </div>

            <div class="preview">
              <span>下一个</span>
              <canvas id="next" width="120" height="120"></canvas>
            </div>

            <div class="actions">
              <button id="pauseButton" type="button">暂停</button>
              <button id="restartButton" type="button">重开</button>
            </div>
          </aside>
        </div>

        <nav class="touch-controls" aria-label="触控操作">
          <button type="button" data-action="left" aria-label="左移">←</button>
          <button type="button" data-action="rotate" aria-label="旋转">↻</button>
          <button type="button" data-action="right" aria-label="右移">→</button>
          <button type="button" data-action="down" aria-label="下落">↓</button>
          <button class="wide" type="button" data-action="drop" aria-label="直接落下">落下</button>
        </nav>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
